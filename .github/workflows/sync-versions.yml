name: Sync game versions

# The extension points its version checks at this fork. Game-version sync is
# manual-only: run `npm run sync-versions` locally before a release, or trigger
# this workflow from the Actions UI. The release workflow warns (but does not
# block) when versions.json is stale.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync versions.json from upstream
        run: npm run sync-versions

      - name: Commit if changed
        run: |
          if git diff --quiet -- versions.json; then
            echo "versions.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: sync game versions from upstream"
          git pull --rebase origin main
          git push origin main
