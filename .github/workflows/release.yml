name: Release

# Release by pushing a tag that matches package.json version + releaseLabel:
#   git tag v2.1.0-salta
#   git push origin v2.1.0-salta
on:
  push:
    tags: ['v2.*-salta']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Resolve and verify version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_LABEL="$(node -p "require('./package.json').cor3Fork.releaseLabel || ''")"
          if [ -z "$RELEASE_LABEL" ]; then
            echo "package.json cor3Fork.releaseLabel is required" >&2
            exit 1
          fi
          EXPECTED="${PKG_VERSION}-${RELEASE_LABEL}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $EXPECTED" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          COR3_VERSION_NAME="$VERSION" npm run build

      - name: Verify manifest identity
        run: |
          node -e "const m=require('./dist/manifest.json');if(m.version_name!==process.env.VERSION){console.error('version_name',m.version_name,'!=',process.env.VERSION);process.exit(1)}if(m.name!=='COR3 Helper 2.0'){console.error('unexpected manifest name',m.name);process.exit(1)}"

      - name: Package
        run: |
          ZIP="COR3 Helper ${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r -X "../${ZIP}" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "COR3 Helper ${{ github.ref_name }}"
          files: |
            COR3 Helper ${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
