name: Release

# Fork release workflow. Push ONLY the specific fork tag, never `git push --tags`:
# the repository also carries all upstream tags, and each would trigger a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Refresh game versions at release time so the artifact always carries
      # the latest versions.json. If it changed, save it for the main-branch
      # update step below.
      - name: Refresh versions.json
        id: versions
        run: |
          npm run sync-versions
          if git diff --quiet -- versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cp versions.json "$RUNNER_TEMP/versions.json"
          fi

      - run: npm run build

      - name: Zip dist
        run: cd dist && zip -r ../cor3-helper-${{ github.ref_name }}.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — Salta fork
          body_path: docs/releases/${{ github.ref_name }}.md
          files: cor3-helper-${{ github.ref_name }}.zip
          prerelease: true

      # Keep the branch used by the extension's update checks in sync. This is
      # a safety net; running `npm run release:prepare` locally before tagging
      # keeps the tag itself consistent as well.
      - name: Update main with release versions.json
        if: steps.versions.outputs.changed == 'true'
        run: |
          git fetch origin main
          git checkout -B versions-sync origin/main
          cp "$RUNNER_TEMP/versions.json" versions.json
          if git diff --quiet -- versions.json; then
            echo "main already has the latest versions.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: sync game versions for ${{ github.ref_name }}"
          git push origin versions-sync:main
