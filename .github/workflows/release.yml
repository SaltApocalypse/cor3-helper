name: Release

# Fork release workflow. Push ONLY the specific fork tag, never `git push --tags`:
# the repository also carries all upstream tags, and each would trigger a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check versions.json freshness
        run: |
          set +e
          node scripts/sync-versions.js --check
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::versions.json is stale — run 'npm run sync-versions' and commit it before tagging."
          elif [ "$status" -ne 0 ]; then
            echo "::warning::versions.json freshness check failed (network/upstream error); continuing with the tagged file."
          fi
          exit 0

      - run: npm ci

      - run: npm run build

      - name: Zip dist
        run: cd dist && zip -r ../cor3-helper-${{ github.ref_name }}.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — Salta fork
          body_path: docs/releases/${{ github.ref_name }}.md
          files: cor3-helper-${{ github.ref_name }}.zip
          # Experimental tags use the `-salta-exp.N` suffix and stay pre-release.
          prerelease: ${{ contains(github.ref_name, '-exp.') }}
