name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build identity
        run: node -e "const p=require('./package.json');const m=require('./dist/manifest.json');const f=p.cor3Fork||{};const v=f.releaseLabel?p.version+'-'+f.releaseLabel+'.'+(f.build||1):p.version;if(m.version_name!==v){console.error('version mismatch:',m.version_name,'!=',v);process.exit(1)}"
